<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>해운 퀀트 분석 대시보드</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242835;--border:#2e3348;
  --text:#e8eaf0;--text2:#9ba1b7;--accent:#4f8cff;--accent2:#6c5ce7;
  --green:#00d68f;--red:#ff6b6b;--orange:#ffa94d;--cyan:#22d3ee;
  --container:#4f8cff;--bulk:#00d68f;--tanker:#ff6b6b;--lpg:#ffa94d;--integ:#c084fc;
}
body{font-family:'IBM Plex Sans KR',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* Sidebar */
#sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:18px 20px;background:linear-gradient(135deg,#1e2235,#2a2f45);border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:15px;font-weight:600;letter-spacing:-0.3px;color:var(--text)}
.sidebar-header p{font-size:11px;color:var(--text2);margin-top:3px}
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.group-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-top:6px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:background .15s;user-select:none}
.group-header:hover{background:var(--surface2)}
.group-header .dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0}
.group-header .arrow{font-size:10px;color:var(--text2);transition:transform .2s}
.group-header.open .arrow{transform:rotate(180deg)}
.group-items{display:none;padding:2px 0 6px 20px}
.group-items.show{display:block}
.chk-row{display:flex;align-items:center;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12.5px;color:var(--text2);transition:all .1s}
.chk-row:hover{background:var(--surface2);color:var(--text)}
.chk-row input{margin-right:8px;accent-color:var(--accent)}
.chk-row.checked{color:var(--text)}
.select-btns{display:flex;gap:4px;margin-left:auto}
.select-btns button{font-size:9px;padding:2px 6px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:3px;cursor:pointer}
.select-btns button:hover{background:var(--border);color:var(--text)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Control bar */
.controls{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:11px;color:var(--text2);font-weight:500;white-space:nowrap}
.mode-btn{font-size:11.5px;padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.mode-btn:hover{border-color:var(--accent);color:var(--text)}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.divider{width:1px;height:24px;background:var(--border);margin:0 4px}

/* Lag slider */
.lag-section{display:flex;align-items:center;gap:8px;padding:4px 12px;background:var(--surface2);border-radius:6px}
.lag-section.disabled{opacity:0.35;pointer-events:none}
.lag-val{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--cyan);min-width:52px;text-align:center}
input[type=range]{-webkit-appearance:none;width:160px;height:4px;background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--cyan);cursor:pointer;border:2px solid var(--bg)}
.lag-hint{font-size:10px;color:var(--text2);max-width:220px;line-height:1.3}

/* Plot area */
#plot-wrap{flex:1;padding:12px 16px 8px;min-height:0}
#plot{width:100%;height:100%;border-radius:8px;overflow:hidden}

/* Info bar */
.info-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text2)}
.info-bar .stats{display:flex;gap:16px}
.info-bar .stat-val{color:var(--text);font-weight:500;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>해운 퀀트 대시보드</h1>
    <p>28개사 × 6팩터 · 2019–2026</p>
  </div>
  <div class="sidebar-scroll" id="sidebar-content"></div>
</div>

<div id="main">
  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">VIEW</span>
      <button class="mode-btn active" data-mode="normal" onclick="setMode(this)">기본 (=100)</button>
      <button class="mode-btn" data-mode="log" onclick="setMode(this)">로그</button>
      <button class="mode-btn" data-mode="momentum" onclick="setMode(this)">4주 모멘텀</button>
      <button class="mode-btn" data-mode="alpha" onclick="setMode(this)">초과수익률 α</button>
    </div>
    <div class="divider"></div>
    <div class="lag-section disabled" id="lagSection">
      <span class="ctrl-label">LAG</span>
      <button class="mode-btn" style="padding:3px 6px;font-size:10px" onclick="nudgeLag(-1)">◀</button>
      <input type="range" id="lagSlider" min="-12" max="12" value="0" step="1" oninput="updateLag()">
      <button class="mode-btn" style="padding:3px 6px;font-size:10px" onclick="nudgeLag(1)">▶</button>
      <span class="lag-val" id="lagVal">0주</span>
      <span class="lag-hint" id="lagHint">팩터를 선택하면 lag 조절 가능</span>
    </div>
  </div>

  <div id="plot-wrap"><div id="plot"></div></div>

  <div class="info-bar">
    <div class="stats">
      <span>선택: <span class="stat-val" id="infoCount">0</span>개</span>
      <span>기간: <span class="stat-val" id="infoPeriod">-</span></span>
      <span>모드: <span class="stat-val" id="infoMode">기본</span></span>
    </div>
    <span>Lag는 팩터 시계열을 시간 이동 · (+)주가 선행 · (-)팩터 선행</span>
  </div>
</div>

<script>
let D = {};
let currentMode = 'normal';
let currentLag = 0;
const typeColors = {'컨테이너':'#4f8cff','벌크':'#00d68f','탱커':'#ff6b6b','LPG':'#ffa94d','종합':'#c084fc'};
const factorColors = {'CCFI':'#4f8cff','BDI':'#00d68f','BDTI':'#ff6b6b','BCTI':'#ff922b','Brent':'#ffa94d','DXY':'#9ba1b7'};

// Load data
fetch('dashboard_data.json')
.then(r=>r.json())
.then(data=>{
  D=data;
  buildSidebar();
  draw();
});

function buildSidebar(){
  const sb=document.getElementById('sidebar-content');
  let html='';
  
  // Factors
  html+=`<div class="group-header open" onclick="toggleGroup(this)" style="margin-top:0">
    <span style="display:flex;align-items:center"><span class="dot" style="background:#22d3ee"></span>팩터 (${D.factors.length})</span>
    <span class="arrow">▾</span></div>`;
  html+=`<div class="group-items show">`;
  D.factors.forEach(f=>{
    html+=`<div class="chk-row" onclick="toggleCheck(this)">
      <input type="checkbox" value="${f}" data-type="factor" ${f==='CCFI'?'checked':''} onchange="onCheck()">
      <span>${f}</span></div>`;
  });
  html+=`</div>`;
  
  // Company groups
  D.groups.forEach(g=>{
    const col=typeColors[g.name]||'#888';
    html+=`<div class="group-header" onclick="toggleGroup(this)">
      <span style="display:flex;align-items:center"><span class="dot" style="background:${col}"></span>${g.name} (${g.companies.length})
      </span>
      <div style="display:flex;align-items:center;gap:4px">
        <button style="font-size:9px;padding:1px 5px;background:transparent;border:1px solid ${col}40;color:${col};border-radius:3px;cursor:pointer" onclick="event.stopPropagation();selectAll('${g.name}',true)">전체</button>
        <button style="font-size:9px;padding:1px 5px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:3px;cursor:pointer" onclick="event.stopPropagation();selectAll('${g.name}',false)">해제</button>
        <span class="arrow">▾</span>
      </div></div>`;
    html+=`<div class="group-items" data-group="${g.name}">`;
    g.companies.forEach(c=>{
      const checked = c==='HMM'?'checked':'';
      html+=`<div class="chk-row ${checked?'checked':''}" onclick="toggleCheck(this)">
        <input type="checkbox" value="${c}" data-type="company" data-vessel="${g.name}" ${checked} onchange="onCheck()">
        <span>${c}</span></div>`;
    });
    html+=`</div>`;
  });
  
  // Indices
  html+=`<div class="group-header" onclick="toggleGroup(this)">
    <span style="display:flex;align-items:center"><span class="dot" style="background:#666"></span>벤치마크 (${D.indices.length})</span>
    <span class="arrow">▾</span></div>`;
  html+=`<div class="group-items">`;
  D.indices.forEach(idx=>{
    html+=`<div class="chk-row" onclick="toggleCheck(this)">
      <input type="checkbox" value="${idx}" data-type="index" onchange="onCheck()">
      <span>${idx}</span></div>`;
  });
  html+=`</div>`;
  
  sb.innerHTML=html;
}

function toggleGroup(el){
  el.classList.toggle('open');
  const items=el.nextElementSibling;
  items.classList.toggle('show');
}

function toggleCheck(row){
  const cb=row.querySelector('input');
  if(document.activeElement!==cb) cb.checked=!cb.checked;
  row.classList.toggle('checked',cb.checked);
  onCheck();
}

function selectAll(groupName,val){
  document.querySelectorAll(`[data-group="${groupName}"] input`).forEach(cb=>{
    cb.checked=val;
    cb.closest('.chk-row').classList.toggle('checked',val);
  });
  onCheck();
}

function onCheck(){
  // Enable lag section if any factor is checked
  const anyFactor=document.querySelector('input[data-type="factor"]:checked');
  document.getElementById('lagSection').classList.toggle('disabled',!anyFactor);
  if(!anyFactor){currentLag=0;document.getElementById('lagSlider').value=0;updateLagDisplay();}
  draw();
}

function setMode(btn){
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentMode=btn.dataset.mode;
  document.getElementById('infoMode')
    .textContent={normal:'기본',log:'로그',momentum:'4주 모멘텀',alpha:'초과수익률'}[currentMode];
  draw();
}

function nudgeLag(delta){
  const sl=document.getElementById('lagSlider');
  sl.value=Math.max(-12,Math.min(12,parseInt(sl.value)+delta));
  updateLag();
}

function updateLag(){
  currentLag=parseInt(document.getElementById('lagSlider').value);
  updateLagDisplay();
  draw();
}

function updateLagDisplay(){
  const v=currentLag;
  document.getElementById('lagVal').textContent=(v>=0?'+':'')+v+'주';
  const hint=document.getElementById('lagHint');
  if(v>0) hint.textContent=`팩터를 ${v}주 앞으로 → 주가가 선행`;
  else if(v<0) hint.textContent=`팩터를 ${-v}주 뒤로 → 팩터가 선행`;
  else hint.textContent='lag 없음 (동시점)';
}

function shiftArray(arr, lag){
  // positive lag = shift factor forward (stock leads)
  // negative lag = shift factor backward (factor leads)
  if(lag===0) return arr;
  const n=arr.length;
  const out=new Array(n).fill(null);
  for(let i=0;i<n;i++){
    const src=i-lag;
    if(src>=0 && src<n) out[i]=arr[src];
  }
  return out;
}

function draw(){
  const checked=document.querySelectorAll('#sidebar-content input:checked');
  const traces=[];
  let factorCount=0, companyCount=0;
  
  checked.forEach(cb=>{
    const key=cb.value;
    const type=cb.dataset.type;
    
    let yData, name=key, dash='solid', width=1.8, opacity=1;
    
    if(type==='factor'){
      factorCount++;
      dash='dot'; width=2.5; opacity=0.9;
      
      if(currentMode==='momentum'){
        yData=currentLag!==0?shiftArray(D.momentum[key],currentLag):D.momentum[key];
      } else if(currentMode==='alpha'){
        // Factor in alpha mode: show normalized
        yData=currentLag!==0?shiftArray(D.series[key],currentLag):D.series[key];
      } else {
        yData=currentLag!==0?shiftArray(D.series[key],currentLag):D.series[key];
      }
      
      const col=factorColors[key]||'#888';
      traces.push({
        x:D.dates, y:yData, name:key+(currentLag!==0?` (lag${currentLag>=0?'+':''}${currentLag})`:''),
        mode:'lines', line:{dash,width,color:col}, opacity,
        hovertemplate:currentMode==='momentum'?'%{y:.2f}%<extra>'+key+'</extra>':'%{y:.1f}<extra>'+key+'</extra>'
      });
      
    } else if(type==='company'){
      companyCount++;
      const vt=D.vessel_map[key]||'';
      const col=typeColors[vt]||'#888';
      
      if(currentMode==='alpha'){
        yData=D.alphas[key];
        if(!yData) return;
        // Convert to cumulative for visibility
        let cum=0;
        yData=yData.map(v=>{
          if(v===null) return null;
          cum+=v;
          return Math.round(cum*10000)/100; // to percentage
        });
      } else if(currentMode==='momentum'){
        yData=D.momentum[key];
      } else {
        yData=D.series[key];
      }
      
      traces.push({
        x:D.dates, y:yData, name:key,
        mode:'lines', line:{width,color:col}, opacity:0.85,
        hovertemplate:currentMode==='momentum'||currentMode==='alpha'?'%{y:.2f}%<extra>'+key+'</extra>':'%{y:.1f}<extra>'+key+'</extra>'
      });
      
    } else if(type==='index'){
      if(currentMode==='alpha'||currentMode==='momentum') return;
      yData=D.index_series[key];
      traces.push({
        x:D.dates, y:yData, name:key,
        mode:'lines', line:{width:1.5,color:'#555',dash:'dashdot'},
        hovertemplate:'%{y:.1f}<extra>'+key+'</extra>'
      });
    }
  });
  
  // Layout
  const titles={
    normal:'정규화 비교 (시작=100)',
    log:'로그 스케일 비교',
    momentum:'4주 모멘텀 (%)',
    alpha:'누적 초과수익률 α (%)'
  };
  
  let yaxis={title:{text:'',font:{size:11,color:'#9ba1b7'}},gridcolor:'#1e2235',zerolinecolor:'#2e3348',tickfont:{size:10,color:'#9ba1b7'}};
  if(currentMode==='log') yaxis.type='log';
  if(currentMode==='momentum'||currentMode==='alpha'){
    yaxis.zeroline=true;yaxis.zerolinecolor='#ff6b6b';yaxis.zerolinewidth=1.5;
  }
  
  const layout={
    title:{text:titles[currentMode]+(currentLag!==0?` · lag=${currentLag>=0?'+':''}${currentLag}주`:''),
      font:{size:14,color:'#e8eaf0',family:'IBM Plex Sans KR'}},
    paper_bgcolor:'#0f1117',plot_bgcolor:'#0f1117',
    xaxis:{
      gridcolor:'#1e2235',tickfont:{size:10,color:'#9ba1b7'},
      rangeslider:{visible:true,bgcolor:'#1a1d27',bordercolor:'#2e3348',thickness:0.06}
    },
    yaxis:yaxis,
    hovermode:'x unified',
    hoverlabel:{bgcolor:'#242835',bordercolor:'#3e4358',font:{size:11,color:'#e8eaf0',family:'IBM Plex Sans KR'}},
    legend:{orientation:'h',y:1.08,x:0,font:{size:11,color:'#9ba1b7'},bgcolor:'transparent'},
    margin:{t:60,b:40,l:50,r:20},
    showlegend:traces.length<=12
  };
  
  const config={responsive:true,displayModeBar:true,modeBarButtonsToRemove:['lasso2d','select2d'],displaylogo:false};
  
  Plotly.react('plot',traces,layout,config);
  
  // Update info
  document.getElementById('infoCount').textContent=factorCount+companyCount;
  document.getElementById('infoPeriod').textContent=D.dates[0]+' ~ '+D.dates[D.dates.length-1];
}
</script>
</body>
</html>
